<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Sunnies Face</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">

    <!-- LOGIN -->
    <div id="loginForm">
        <div class="login-header">
            <header>Login</header>
        </div>

        <div class="input-box">
            <input type="text" id="loginEmail" class="input-field" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" id="loginPassword" class="input-field" placeholder="Password">
        </div>

        <div class="forgot">
            <section>
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe"> Remember me</label>
            </section>
            <section>
                <a href="#" onclick="forgotPassword()">Forgot password</a>
            </section>
        </div>

        <p id="loginError" style="color:red; text-align:center;"></p>

        <div class="input-submit">
            <button class="submit-btn" onclick="loginUser()"></button>
            <label>Login</label>
        </div>

        <div class="sign-up-link">
            <p>Don't have an account? <a href="#" onclick="showRegister()">Sign Up</a></p>
        </div>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" style="display:none;">
        <div class="login-header">
            <header>Register</header>
        </div>

        <div class="input-box">
            <input type="text" id="regName" class="input-field" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input type="text" id="regEmail" class="input-field" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" id="regPassword" class="input-field" placeholder="Password">
        </div>

        <div class="input-box">
            <input type="password" id="regConfirm" class="input-field" placeholder="Confirm Password">
        </div>

        <p id="registerError" style="color:red; text-align:center;"></p>

        <div class="input-submit">
            <button class="submit-btn" onclick="registerUser()"></button>
            <label>Sign Up</label>
        </div>

        <div class="sign-up-link">
            <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
        </div>
    </div>

</div>

<script src="login.js"></script>
</body>
</html>
